<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage Content Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
              <a class="navbar-brand" href="index.html">Galib</a>
              <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                  <a class="nav-item nav-link " href="index.html">Note Generator</a>
                  <a class="nav-item nav-link " href="chatbot.html">Chatbot</a>
                  <a class="nav-item nav-link active" href="gpt-home-content.html">GPT-Home</a>
                </div>
              </div>
            </nav>
        </div>
    </div>    <div class="dtent-body-wrap">
        <div class="container mt-5">
            <div class="row">
                <!-- Left Column -->
		      <div class="col-md-4">
		        <div class="column-box">
		          <h5>Input Details</h5>
		          <div class="mb-3">
		            <label class="form-label">Business Name</label>
		            <input type="text" id="businessName" class="form-control" placeholder="Enter business name">
		          </div>
		          <div class="mb-3">
		            <label class="form-label">Keywords (one per line)</label>
		            <textarea id="keywords" class="form-control"></textarea>
		          </div>
		        </div>
		      </div>

		      <!-- Middle Column -->
		      <div class="col-md-4 d-flex align-items-center justify-content-center">
		        <button id="generateBtn" class="btn btn-primary btn-lg px-4 py-3">Generate Prompt →</button>
		      </div>

		      <!-- Right Column -->
		      <div class="col-md-4 position-relative">
		        <div class="column-box">
		          <button class="btn btn-sm btn-outline-secondary copy-btn" id="copyBtn">Copy</button>
		          <h5>Generated Output</h5>
		          <pre id="output" class="output"></pre>
		        </div>
		      </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
  // Helper: robust copy with fallback
  function copyTextToClipboard(text) {
    if (!text) return Promise.reject();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = 0;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject();
    }
  }

  // Build the output text (starting directly from 1) Slider...)
  function buildOutput(businessName, keywordsArray) {
    const keywordsInline = keywordsArray.length ? keywordsArray.join(', ') : '(none provided)';

    return `
1) Slider/Banner/Hero Area:
Subheadline (3-5 words): 
Headline (8-12 words): 

2) About Us:
Headline: 
Description (90-100 words): 

3) We are here to help section: 
Subheadline: 3-4 words
Headline (3-4 words): 
Description: 55-60 words

4) Free Consultation Section:
Subheadline: 3-4 words
Headline (4-5 words): 
Description: 70-80 words

5) Testimonials:
Description (25-35 words): 

6) Get In Touch Section (18-20 words):

7) Footer About Us (45-50 words):
===================
Write above format content based on the following info:
Business name: ${businessName || '(From Input - not provided)'}
Excluded words/phrases: Ally, We we are, Nagigating, At [${businessName || ''}]
Keywords: ${keywordsInline}
`.trim();
  }

  $(function() {
    $('#generateBtn').on('click', function() {
      const business = $('#businessName').val().trim();
      const keywords = $('#keywords').val().split(/\r?\n/).map(k => k.trim()).filter(k => k);
      const output = buildOutput(business, keywords);
      $('#output').text(output);
    });

    $('#copyBtn').on('click', function() {
      const text = $('#output').text();
      if (!text) return;
      copyTextToClipboard(text)
        .then(() => {
          $('#copyBtn').text('Copied!').removeClass('btn-outline-secondary').addClass('btn-success');
          setTimeout(() => {
            $('#copyBtn').text('Copy').removeClass('btn-success').addClass('btn-outline-secondary');
          }, 1500);
        })
        .catch(() => {
          $('#copyBtn').text('Copy failed').removeClass('btn-outline-secondary').addClass('btn-danger');
          setTimeout(() => {
            $('#copyBtn').text('Copy').removeClass('btn-danger').addClass('btn-outline-secondary');
          }, 1500);
        });
    });
  });
</script>
</body>
</html>
